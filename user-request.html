<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>แจ้งขอรับบริการ | IT Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="app.css?v=20260902-1">
    <link rel="stylesheet" href="user-request.css?v=20260902-1">
</head>
<body class="public-ticket-body user-request-body">
    <main class="public-ticket-shell user-request-shell">
        <section class="public-ticket-hero user-request-hero">
            <div class="public-ticket-brand" aria-label="IT Management">
                <span>IT</span>
                <strong>IT Management</strong>
            </div>
            <div class="public-ticket-hero__copy">
                <p>USER REQUEST</p>
                <h1>แจ้งขอรับบริการ IT</h1>
                <span>แจ้งปัญหาหน้างานหรือขอเบิกอุปกรณ์จากฝ่าย IT</span>
            </div>
        </section>

        <section class="public-ticket-choice public-ticket-choice--user" id="userRequestChoice" aria-label="เลือกประเภทคำขอ">
            <div class="public-ticket-choice__grid">
                <button class="public-ticket-choice__card public-ticket-choice__card--onsite" type="button" data-requested-service="On-site">
                    <span class="public-ticket-choice__icon"><i class="fa-solid fa-person-walking-arrow-right"></i></span>
                    <strong>แจ้งปัญหาหน้างาน</strong>
                    <small>แจ้งให้ IT เข้าดำเนินการ ณ จุดที่พบปัญหา</small>
                    <i class="fa-solid fa-arrow-right public-ticket-choice__arrow"></i>
                </button>
                <button class="public-ticket-choice__card public-ticket-choice__card--equipment" type="button" data-requested-service="Equipment Requisition">
                    <span class="public-ticket-choice__icon"><i class="fa-solid fa-box-open"></i></span>
                    <strong>เบิกอุปกรณ์</strong>
                    <small>แจ้งความต้องการอุปกรณ์จาก Inventory</small>
                    <i class="fa-solid fa-arrow-right public-ticket-choice__arrow"></i>
                </button>
            </div>
        </section>

        <section class="public-ticket-card hidden" id="userRequestFormCard" aria-labelledby="userRequestFormTitle">
            <div class="public-ticket-card__header">
                <div class="public-ticket-card__icon"><i class="fa-solid fa-clipboard-list"></i></div>
                <div>
                    <p>USER REQUEST</p>
                    <h2 id="userRequestFormTitle">รายละเอียดคำขอ</h2>
                </div>
                <button class="public-ticket-back" id="backToRequestTypeButton" type="button" title="กลับไปเลือกบริการ"><i class="fa-solid fa-arrow-left"></i><span>กลับ</span></button>
            </div>

            <form id="userRequestForm" class="public-ticket-form" novalidate>
                <input id="requestedService" name="requestedService" type="hidden">
                <div class="public-ticket-form__grid" id="userRequestFormGrid">
                    <label>
                        <span id="requesterLabel">ชื่อผู้แจ้ง <em>*</em></span>
                        <input id="requester" name="requester" type="text" maxlength="120" autocomplete="name" required placeholder="ชื่อ - นามสกุล">
                    </label>
                    <label>
                        <span>แผนก <em>*</em></span>
                        <select id="department" name="department" required>
                            <option value="">เลือกแผนก</option>
                            <option>PD</option>
                            <option>PC/Warehouse</option>
                            <option>PE/Tooling</option>
                            <option>QA/QC</option>
                            <option>Design</option>
                            <option>ซ่อมบำรุง</option>
                            <option>จัดซื้อ</option>
                            <option>บุคคล</option>
                            <option>บัญชี</option>
                            <option>Safety</option>
                            <option>IT</option>
                        </select>
                    </label>
                    <label>
                        <span>เบอร์ติดต่อหรืออีเมล</span>
                        <input id="contact" name="contact" type="text" maxlength="160" autocomplete="tel" placeholder="เช่น 081-234-5678 หรือ name@company.com">
                    </label>
                    <label class="hidden public-ticket-equipment-item" id="equipmentItemField">
                        <span>รายการอุปกรณ์ <em>*</em></span>
                        <div class="public-ticket-combobox">
                            <input id="equipmentItemSearch" type="search" autocomplete="off" disabled placeholder="พิมพ์ค้นหารายการอุปกรณ์">
                            <input id="equipmentItemId" name="equipmentItemId" type="hidden" disabled>
                            <div class="public-ticket-combobox__options hidden" id="equipmentItemOptions" role="listbox"></div>
                        </div>
                        <small id="equipmentItemHint">ค้นหาและเลือกรายการที่มีในคลัง</small>
                    </label>
                    <label class="hidden" id="equipmentQuantityField">
                        <span>จำนวน <em>*</em></span>
                        <input id="equipmentQuantity" name="equipmentQuantity" type="number" min="1" step="1" inputmode="numeric" disabled placeholder="0">
                    </label>
                    <label id="categoryField">
                        <span>ประเภทปัญหา <em>*</em></span>
                        <select id="category" name="category" required>
                            <option value="">เลือกประเภทปัญหา</option>
                            <option>Hardware</option>
                            <option>Software</option>
                            <option>Printer</option>
                            <option>Network / Internet</option>
                            <option>Email / Microsoft 365</option>
                            <option>ERP / D365</option>
                            <option>Account / Access</option>
                            <option>Other</option>
                        </select>
                    </label>
                    <label>
                        <span>สถานที่ / จุดที่พบปัญหา / เครื่องคอมพิวเตอร์ <em>*</em></span>
                        <input id="location" name="location" type="text" maxlength="240" required placeholder="เช่น ชั้น 2, Line A, โต๊ะ QA-04">
                    </label>
                    <label class="public-ticket-form__full" id="subjectField">
                        <span>สรุปปัญหา <em>*</em></span>
                        <textarea id="subject" name="subject" rows="2" maxlength="180" required placeholder="เช่น Printer ชั้น 2 พิมพ์ไม่ได้"></textarea>
                    </label>
                </div>

                <div class="ticket-signature-field hidden" id="equipmentSignatureSection">
                    <div><span>ลายเซ็นผู้เบิก <em>*</em></span><button id="clearEquipmentSignature" type="button">ล้าง</button></div>
                    <canvas id="equipmentSignatureCanvas" aria-label="ลายเซ็นผู้เบิก"></canvas>
                    <small>ลงลายเซ็นในช่องนี้ด้วยนิ้ว ปากกา หรือเมาส์</small>
                </div>

                <div id="ticketPhotoSection">
                    <label class="public-ticket-photo" for="ticketPhoto">
                        <input id="ticketPhoto" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
                        <span class="public-ticket-photo__icon"><i class="fa-solid fa-camera"></i></span>
                        <span class="public-ticket-photo__copy"><strong>ถ่ายรูปหรือแนบรูป</strong><small>ไม่บังคับ JPG, PNG หรือ WEBP ไม่เกิน 5 MB</small></span>
                        <span class="public-ticket-photo__action">เลือกรูป</span>
                    </label>
                    <div class="public-ticket-preview hidden" id="photoPreview">
                        <img id="photoPreviewImage" alt="ตัวอย่างรูปที่เลือก">
                        <button id="removePhotoButton" type="button" title="ลบรูป" aria-label="ลบรูป"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>

                <input class="public-ticket-honeypot" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
                <div class="public-ticket-form__footer">
                    <p><i class="fa-solid fa-circle-info"></i> ระบบจะส่งคำขอให้ฝ่าย IT ดำเนินการ</p>
                    <button class="public-ticket-submit" type="submit"><i class="fa-solid fa-paper-plane"></i><span>ส่งคำขอ</span></button>
                </div>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="user-request.js?v=20260902-2"></script>
</body>
</html>
