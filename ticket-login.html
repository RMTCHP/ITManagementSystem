<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Ticket Login | IT Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="ticket-login.css?v=20260815-1">
</head>
<body class="ticket-login-body">
    <main class="ticket-login-shell">
        <section class="ticket-login-hero">
            <div class="ticket-login-brand"><span>IT</span><strong>IT Management</strong></div>
            <p>IT SERVICE DESK</p>
            <h1>Sign in to My Job</h1>
            <small>Use your IT account to create and close tickets.</small>
        </section>

        <section class="ticket-login-card" aria-labelledby="ticketLoginTitle">
            <div class="ticket-login-card__icon"><i class="fa-solid fa-user-shield"></i></div>
            <h2 id="ticketLoginTitle">IT Login</h2>
            <p>Only authorized IT staff can access this workspace.</p>
            <form id="ticketLoginForm" novalidate>
                <label for="ticketLoginUsername">Username</label>
                <input id="ticketLoginUsername" type="text" autocomplete="username" maxlength="120" required placeholder="Enter username">
                <label for="ticketLoginPassword">Password</label>
                <input id="ticketLoginPassword" type="password" autocomplete="current-password" required placeholder="Enter password">
                <button type="submit"><i class="fa-solid fa-right-to-bracket"></i><span>Login to Ticket Workspace</span></button>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="ticket-login.js"></script>
</body>
</html>
